[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opm-vis"
version = "0.1.0"
description = "Visualization tools for OPM results"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.9"
authors = [
    { name = "Svenn Tveit", email = "svtv@norceresearch.no" },
]
dependencies = [
    "numpy",
    "matplotlib",
    "opm",
]

[project.optional-dependencies]
dev = ["pytest"]
# The opm_vis.pvplot backend is optional: it pulls in VTK, which is a large binary
# dependency that users of the matplotlib backend in opm_vis.plot do not need.
pyvista = ["pyvista>=0.44"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
